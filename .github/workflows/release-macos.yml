# Release macOS a cada push na main.
# Roda no runner de macOS da org (labels self-hosted, macOS, ARM64).
# Esse é o runner do Mac Mini: nos jobs da org o nome registrado é iramars-air-macos.
# Runner de organização só executa repositório da org Falcao-SL.

name: Release macOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lulu-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and release
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v5

      - name: Version
        id: version
        run: |
          set -euo pipefail
          base=$(tr -d '[:space:]' < VERSION)
          echo "version=${base}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          chmod +x Scripts/build.sh Scripts/package-macos.sh
          ./Scripts/package-macos.sh

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Lulu ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            Build da main em `${{ github.sha }}`.

            macOS 14 ou mais novo, Apple Silicon.

            A assinatura deste pacote é ad hoc, feita no runner. Na primeira abertura, clique com o botão direito em Lulu e escolha Abrir.
          files: |
            dist/Lulu-${{ steps.version.outputs.version }}-macos-arm64.zip
            dist/Lulu-${{ steps.version.outputs.version }}-macos-arm64.dmg
            dist/Lulu-macos-arm64.dmg
            dist/SHA256SUMS
